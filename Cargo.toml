[package]
name = "octa"
version = "0.6.0"
edition = "2021"
description = "Roland OCTA/QUAD-CAPTURE rate control and PipeWire sync for Linux"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
alsa = "0.9.1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
rusb = "0.9"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rfd = "0.17.2"

[[bin]]
name = "octa-control"
path = "src/bin/octa-control.rs"
