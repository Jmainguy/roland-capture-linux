# Generated by tools/generate_mono_ucm.py.
# Inputs and unpaired outputs are mono; explicit L/R destinations are stereo.
# At 192 kHz use the Pro Audio profile because the hardware channel count changes.
Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "oc_mono_out"
			Direction Playback
			Channels 1
			HWChannels 10
			HWChannelPos0 MONO
			HWChannelPos1 MONO
			HWChannelPos2 MONO
			HWChannelPos3 MONO
			HWChannelPos4 MONO
			HWChannelPos5 MONO
			HWChannelPos6 MONO
			HWChannelPos7 MONO
			HWChannelPos8 MONO
			HWChannelPos9 MONO
		}
	}
	{
		SplitPCM {
			Name "oc_stereo_out"
			Direction Playback
			Channels 2
			HWChannels 10
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
			HWChannelPos8 FL
			HWChannelPos9 FR
		}
	}
	{
		SplitPCM {
			Name "oc_mono_in"
			Direction Capture
			Channels 1
			HWChannels 12
			HWChannelPos0 MONO
			HWChannelPos1 MONO
			HWChannelPos2 MONO
			HWChannelPos3 MONO
			HWChannelPos4 MONO
			HWChannelPos5 MONO
			HWChannelPos6 MONO
			HWChannelPos7 MONO
			HWChannelPos8 MONO
			HWChannelPos9 MONO
			HWChannelPos10 MONO
			HWChannelPos11 MONO
		}
	}
	{
		SplitPCM {
			Name "oc_stereo_in"
			Direction Capture
			Channels 2
			HWChannels 12
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
			HWChannelPos8 FL
			HWChannelPos9 FR
			HWChannelPos10 FL
			HWChannelPos11 FR
		}
	}
]

