# Generated by tools/generate_mono_ucm.py.
# Inputs and unpaired outputs are mono; explicit L/R destinations are stereo.
# At 192 kHz use the Pro Audio profile because the hardware channel count changes.
Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "qc_mono_out"
			Direction Playback
			Channels 1
			HWChannels 4
			HWChannelPos0 MONO
			HWChannelPos1 MONO
			HWChannelPos2 MONO
			HWChannelPos3 MONO
		}
	}
	{
		SplitPCM {
			Name "qc_stereo_out"
			Direction Playback
			Channels 2
			HWChannels 4
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
		}
	}
	{
		SplitPCM {
			Name "qc_mono_in"
			Direction Capture
			Channels 1
			HWChannels 6
			HWChannelPos0 MONO
			HWChannelPos1 MONO
			HWChannelPos2 MONO
			HWChannelPos3 MONO
			HWChannelPos4 MONO
			HWChannelPos5 MONO
		}
	}
	{
		SplitPCM {
			Name "qc_stereo_in"
			Direction Capture
			Channels 2
			HWChannels 6
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
		}
	}
]

# Playback destinations

SectionDevice."Line1" {
	Comment "Main / Phones Output 1–2"

	Value {
		PlaybackPriority 1000
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "qc_stereo_out"
		Direction Playback
		HWChannels 4
		Channels 2
		Channel0 0
		ChannelPos0 FL
		Channel1 1
		ChannelPos1 FR
	}
}

SectionDevice."Line2" {
	Comment "Coaxial Output 3–4"

	Value {
		PlaybackPriority 999
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "qc_stereo_out"
		Direction Playback
		HWChannels 4
		Channels 2
		Channel0 2
		ChannelPos0 FL
		Channel1 3
		ChannelPos1 FR
	}
}

# Capture sources

SectionDevice."Line3" {
	Comment "Input 1"

	Value {
		CapturePriority 1200
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "qc_mono_in"
		Direction Capture
		HWChannels 6
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
}

SectionDevice."Line4" {
	Comment "Input 2"

	Value {
		CapturePriority 1199
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "qc_mono_in"
		Direction Capture
		HWChannels 6
		Channels 1
		Channel0 1
		ChannelPos0 MONO
	}
}

SectionDevice."Line5" {
	Comment "Coaxial Input 3–4"

	Value {
		CapturePriority 1198
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "qc_stereo_in"
		Direction Capture
		HWChannels 6
		Channels 2
		Channel0 2
		ChannelPos0 FL
		Channel1 3
		ChannelPos1 FR
	}
}

SectionDevice."Line6" {
	Comment "Direct Mix Input 5–6"

	Value {
		CapturePriority 1197
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "qc_stereo_in"
		Direction Capture
		HWChannels 6
		Channels 2
		Channel0 4
		ChannelPos0 FL
		Channel1 5
		ChannelPos1 FR
	}
}
